# This file serves the built frontend when Nginx runs without a Compose API proxy.
#
# TLDR: returns the app entry page for unmatched paths and applies the configured
# long cache lifetime to matching static asset extensions.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fall back to the app entry point when a request does not match a file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # These matching asset types receive long-lived caching; other paths do not.
    location ~* \.(?:css|js|mjs|map|svg|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
