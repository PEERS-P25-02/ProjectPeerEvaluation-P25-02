# This file serves the frontend in Docker and forwards API calls to the backend.
#
# TLDR: resolves the backend through Docker DNS, keeps /api on the browser's
# frontend origin, and serves the built single-page app and static assets.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream peers_backend {
    zone peers_backend 64k;
    server backend:5000 resolve;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep browser requests on the frontend origin; service DNS stays in Docker.
    location ^~ /api/ {
        proxy_pass http://peers_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # These matching asset types receive long-lived caching; other paths do not.
    location ~* \.(?:css|js|mjs|map|svg|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
