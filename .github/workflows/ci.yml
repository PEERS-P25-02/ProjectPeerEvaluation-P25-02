# PR checks use one immutable head and a merge-base diff against the event base.
name: CI - Build Lint and Tests
on:
  pull_request:
    branches:
      - main
      - ci/selective-regression
permissions:
  contents: read
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  select-tests:
    name: Select Regression Tests
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      integration: ${{ steps.select.outputs.integration }}
      e2e: ${{ steps.select.outputs.e2e }}
      integration-files: ${{ steps.select.outputs.integration-files }}
      e2e-files: ${{ steps.select.outputs.e2e-files }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check selector and gate policy
        run: node --test scripts/selectRegressionTests.test.cjs scripts/ciGate.test.cjs scripts/regressionChanges.test.cjs scripts/integrationTestPaths.test.cjs
      - name: Select regression tests
        id: select
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/regressionChanges.cjs > changes.json
          CHANGED_FILES="$(jq -c '.files' changes.json)" node scripts/selectRegressionTests.cjs > selection.json
          jq -e '.mode == "none" or .mode == "selected" or .mode == "full"' selection.json
          {
            echo "mode=$(jq -r '.mode' selection.json)"
            echo "integration=$(jq -r '.integration | length > 0' selection.json)"
            echo "e2e=$(jq -r '.e2e | length > 0' selection.json)"
            echo "integration-files=$(jq -c '.integration' selection.json)"
            echo "e2e-files=$(jq -c '.e2e' selection.json)"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Regression selection'
            echo "- Mode: **$(jq -r '.mode' selection.json)**"
            echo "- Changed paths: $(jq -r '.files | length' changes.json)"
            echo "- Frontend unit tests: $(jq -r '.frontendUnit | length' selection.json)"
            echo "- Backend unit tests: $(jq -r '.backendUnit | length' selection.json)"
            echo "- Integration tests: $(jq -r '.integration | length' selection.json)"
            echo "- Browser tests: $(jq -r '.e2e | length' selection.json)"
            if [[ "$(jq -r '.mode' selection.json)" == full ]]; then
              echo '- Discovery: full integration and browser suites'
            else
              echo "- Integration paths: $(jq -r '.integration | join(", ")' selection.json)"
              echo "- Browser paths: $(jq -r '.e2e | join(", ")' selection.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: selection-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            selection.json
            changes.json
          if-no-files-found: error
  # Keep the build independent so it reports separately from quality and tests.
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  code-quality:
    name: Lint and Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/backend/package-lock.json
      - name: Install frontend dependencies
        id: install-frontend
        run: npm ci
      - name: Install backend dependencies
        id: install-backend
        run: npm ci
        working-directory: ./src/backend
      - name: Check coverage engine policy
        if: ${{ !cancelled() && steps.install-frontend.outcome == 'success' }}
        run: node --test scripts/coverage/coverage.test.cjs
      - name: Lint frontend and backend
        if: ${{ !cancelled() && steps.install-backend.outcome == 'success' }}
        run: npm run lint
      # Run independent checks after a prior failure while still respecting cancellation.
      - name: Check formatting
        if: ${{ !cancelled() && steps.install-frontend.outcome == 'success' }}
        run: npm run format:check

  unit-tests:
    name: Unit Tests with Coverage
    runs-on: ubuntu-latest
    needs: select-tests
    if: ${{ needs.select-tests.result == 'success' && needs.select-tests.outputs.mode != 'none' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix src/backend
      - name: Complete frontend unit suite with canonical coverage
        id: frontend
        env:
          PEERS_COVERAGE: '1'
        run: npm test
      - name: Complete backend unit suite with coverage
        if: ${{ !cancelled() }}
        run: npm run test:coverage
        working-directory: ./src/backend
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: unit-coverage-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/
            src/backend/coverage/
          if-no-files-found: error
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: select-tests
    if: ${{ needs.select-tests.result == 'success' && needs.select-tests.outputs.integration == 'true' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Run integration tests with runtime coverage
        env:
          PEERS_COVERAGE: '1'
          MODE: ${{ needs.select-tests.outputs.mode }}
          SELECTED: ${{ needs.select-tests.outputs.integration-files }}
        run: |
          if [[ "$MODE" == full ]]; then
            npm run test:integration
          else
            mapfile -t files < <(jq -r '.[]' <<< "$SELECTED")
            test "${#files[@]}" -gt 0
            npm run test:integration -- "${files[@]}"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: integration-results-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/integration/
          if-no-files-found: error
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-22.04
    needs: select-tests
    if: ${{ needs.select-tests.result == 'success' && needs.select-tests.outputs.e2e == 'true' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Run selected e2e tests
        env:
          MODE: ${{ needs.select-tests.outputs.mode }}
          SELECTED: ${{ needs.select-tests.outputs.e2e-files }}
        run: |
          if [[ "$MODE" == full ]]; then
            npm run test:e2e
          else
            mapfile -t files < <(jq -r '.[]' <<< "$SELECTED")
            test "${#files[@]}" -gt 0
            npm run test:e2e -- "${files[@]}"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: e2e-results-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/e2e/
          if-no-files-found: error
  patch-coverage:
    name: Initial Changed-Line Coverage
    runs-on: ubuntu-latest
    needs: [select-tests, unit-tests, integration-tests]
    if: ${{ !cancelled() && always() && needs.select-tests.result == 'success' && needs.select-tests.outputs.mode != 'none' && needs.unit-tests.result == 'success' && (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') }}
    outputs:
      broaden: ${{ steps.coverage.outputs.broaden }}
      decision: ${{ steps.coverage.outputs.decision }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8.0.1
        with:
          path: coverage-artifacts
          pattern: '*-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'
      - name: Combine runtime and unit coverage and evaluate patch
        id: coverage
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/runCiCoverage.cjs
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: initial-coverage-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: error

  broaden-regression:
    name: Broaden Full API Coverage
    runs-on: ubuntu-22.04
    needs: patch-coverage
    if: ${{ needs.patch-coverage.result == 'success' && needs.patch-coverage.outputs.decision == 'broaden' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Full API integration discovery
        env:
          PEERS_COVERAGE: '1'
        run: npm run test:integration
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: broaden-integration-results-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/integration/
          if-no-files-found: error

  final-coverage:
    name: Enforce Changed-Line Coverage
    runs-on: ubuntu-latest
    needs: [select-tests, patch-coverage, broaden-regression]
    if: ${{ !cancelled() && always() && needs.select-tests.outputs.mode != 'none' && needs.patch-coverage.result == 'success' && ((needs.patch-coverage.outputs.decision == 'broaden' && needs.broaden-regression.result == 'success') || (needs.patch-coverage.outputs.decision != 'broaden' && needs.broaden-regression.result == 'skipped')) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.1
        if: ${{ needs.patch-coverage.outputs.decision != 'broaden' }}
        with:
          path: coverage-artifacts
          pattern: initial-coverage-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Enforce retained initial coverage decision
        if: ${{ needs.patch-coverage.outputs.decision != 'broaden' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          REPORT_DIR: coverage-artifacts
        run: node scripts/coverageDecision.cjs
      - name: Install coverage dependencies
        if: ${{ needs.patch-coverage.outputs.decision == 'broaden' }}
        run: npm ci
      - uses: actions/download-artifact@v8.0.1
        if: ${{ needs.patch-coverage.outputs.decision == 'broaden' }}
        with:
          path: coverage-artifacts
          pattern: '*-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'
      - name: Recalculate and enforce API broadened coverage
        if: ${{ needs.patch-coverage.outputs.decision == 'broaden' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRE_BROADEN: 'true'
        run: node scripts/runCiCoverage.cjs
      - name: Enforce recalculated API coverage decision
        if: ${{ needs.patch-coverage.outputs.decision == 'broaden' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          REPORT_DIR: coverage
        run: node scripts/coverageDecision.cjs
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() && needs.patch-coverage.outputs.decision == 'broaden' }}
        with:
          name: final-coverage-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: error

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [select-tests, frontend-build, code-quality, unit-tests, integration-tests, e2e-tests, patch-coverage, broaden-regression, final-coverage, dependency-vulnerability-scan, secret-scan]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Enforce every required job outcome
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ciGate.cjs

  dependency-vulnerability-scan:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # The updater writes this shared cache namespace after a complete successful refresh.
      - name: Prepare scanner data and report directories
        id: dependency-check-paths
        run: |
          echo "data=$RUNNER_TEMP/dependency-check-data" >> "$GITHUB_OUTPUT"
          echo "reports=$RUNNER_TEMP/dependency-check-reports" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/dependency-check-data" "$RUNNER_TEMP/dependency-check-reports"

      # PR/push jobs only restore a completed updater cache; they never call NVD or save data.
      - name: Restore Dependency-Check vulnerability data
        id: dependency-check-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.dependency-check-paths.outputs.data }}
          key: dependency-check-v13.0.0-shared-v1-${{ runner.os }}-reader-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dependency-check-v13.0.0-shared-v1-${{ runner.os }}-

      - name: Validate cached Dependency-Check database freshness
        id: dependency-check-database
        env:
          DATA_DIR: ${{ steps.dependency-check-paths.outputs.data }}
        run: |
          python3 - "$DATA_DIR" <<'PY'
          from pathlib import Path
          import sys
          import time

          data_dir = Path(sys.argv[1])
          database = data_dir / "odc.mv.db"
          timestamp = data_dir / ".dependency-check-last-successful-update"
          if not database.is_file() or database.stat().st_size == 0:
              raise SystemExit("No completed Dependency-Check database cache was restored, or its database is empty. Run Update Dependency-Check Database on the default branch, then rerun this check.")
          try:
              updated_at = int(timestamp.read_text(encoding="ascii").strip())
          except (OSError, UnicodeError, ValueError):
              raise SystemExit("Cached Dependency-Check update timestamp is missing or malformed; run Update Dependency-Check Database on the default branch.")
          age_seconds = int(time.time()) - updated_at
          if age_seconds < 0:
              raise SystemExit("Cached Dependency-Check update timestamp is in the future; run Update Dependency-Check Database on the default branch.")
          if age_seconds > 48 * 60 * 60:
              raise SystemExit("Cached Dependency-Check database is older than 48 hours; run Update Dependency-Check Database on the default branch.")
          PY

      # Dependency-Check analyzes both lockfiles, including development dependencies.
      - name: Scan both npm lockfiles
        id: dependency-check-scan
        continue-on-error: true
        run: |
          status=0
          test -s "$GITHUB_WORKSPACE/package-lock.json"
          test -s "$GITHUB_WORKSPACE/src/backend/package-lock.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "${{ steps.dependency-check-paths.outputs.data }}:/usr/share/dependency-check/data" \
            --volume "${{ steps.dependency-check-paths.outputs.reports }}:/report" \
            owasp/dependency-check:13.0.0 \
            --project peers-npm-dependencies \
            --scan /src/package-lock.json \
            --scan /src/src/backend/package-lock.json \
            --format HTML \
            --format JSON \
            --out /report \
            --data /usr/share/dependency-check/data \
            --noupdate \
            --failOnCVSS 7 || status=$?
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Validate Dependency-Check reports
        id: dependency-check-reports
        if: always()
        run: |
          html="$RUNNER_TEMP/dependency-check-reports/dependency-check-report.html"
          json="$RUNNER_TEMP/dependency-check-reports/dependency-check-report.json"
          test -s "$html"
          grep -Eiq '<html([[:space:]>])' "$html"
          test -s "$json"
          python3 - "$json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              report = json.load(report_file)

          scan_info = report.get("scanInfo") if isinstance(report, dict) else None
          project_info = report.get("projectInfo") if isinstance(report, dict) else None
          dependencies = report.get("dependencies") if isinstance(report, dict) else None
          # Clean lockfile-only scans can have no dependency entries; require the list, not a finding.
          if (
              not isinstance(scan_info, dict)
              or scan_info.get("engineVersion") != "13.0.0"
              or not isinstance(project_info, dict)
              or project_info.get("name") != "peers-npm-dependencies"
              or not isinstance(dependencies, list)
          ):
              raise SystemExit("Dependency-Check JSON is missing the expected scanner, project, or dependencies list")
          PY

      # Retain whichever reports were produced, including when scan validation fails.
      - name: Upload Dependency-Check reports
        id: dependency-check-upload
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: owasp-dependency-check-report
          path: |
            ${{ steps.dependency-check-paths.outputs.reports }}/dependency-check-report.html
            ${{ steps.dependency-check-paths.outputs.reports }}/dependency-check-report.json
          if-no-files-found: error

      - name: Summarize Dependency-Check result and enforce security gate
        if: always()
        env:
          DATABASE_OUTCOME: ${{ steps.dependency-check-database.outcome }}
          SCAN_OUTCOME: ${{ steps.dependency-check-scan.outcome }}
          SCAN_EXIT_CODE: ${{ steps.dependency-check-scan.outputs.exit-code }}
          REPORT_OUTCOME: ${{ steps.dependency-check-reports.outcome }}
          UPLOAD_OUTCOME: ${{ steps.dependency-check-upload.outcome }}
          REPORT_JSON: ${{ steps.dependency-check-paths.outputs.reports }}/dependency-check-report.json
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import html
          import os
          from pathlib import Path

          failures = []
          details = []

          def error(message):
              # Escape GitHub workflow-command delimiters in any report-derived text.
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{escaped}')
              failures.append(message)

          def summary_text(value):
              # Keep report-controlled values on one Markdown line and inside list text.
              text = str(value).replace('\\', '\\\\').replace('|', '\\|').replace('`', '\\`').replace('[', '\\[').replace(']', '\\]')
              return html.escape(text.replace('\r', ' ').replace('\n', ' '), quote=True)

          if os.environ['DATABASE_OUTCOME'] != 'success':
              error('Dependency-Check database validation failed; inspect the freshness validation step and run the default-branch database updater.')

          scan_outcome = os.environ['SCAN_OUTCOME']
          scan_code = os.environ.get('SCAN_EXIT_CODE', '')
          if scan_outcome != 'success':
              if scan_code == '15':
                  details.append('Scanner exit code 15 indicates the configured CVSS 7 security gate failed.')
                  error('The configured Dependency-Check CVSS 7 security gate failed; see the findings listed in the job summary.')
              elif scan_code:
                  error(f'Dependency-Check scanner failed with exit code {scan_code}; inspect the scan step logs for scanner or setup errors.')
              elif os.environ['DATABASE_OUTCOME'] != 'success':
                  details.append('The scan did not run because database validation failed.')
              else:
                  error('Dependency-Check scan did not complete and produced no scanner exit code; inspect the scan step for setup or runner errors.')

          report_path = Path(os.environ['REPORT_JSON'])
          report = None
          if os.environ['REPORT_OUTCOME'] != 'success':
              error('Dependency-Check report validation failed; inspect the report validation step for missing, malformed, or unexpected reports.')
          else:
              try:
                  report = json.loads(report_path.read_text(encoding='utf-8'))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  error('Dependency-Check JSON report could not be read for the summary.')

          findings = []
          if isinstance(report, dict):
              for dependency in report.get('dependencies', []):
                  if not isinstance(dependency, dict):
                      continue
                  package = dependency.get('packages')
                  package_name = package[0].get('id') if isinstance(package, list) and package and isinstance(package[0], dict) else None
                  package_name = package_name or dependency.get('fileName') or 'Unknown package'
                  for vulnerability in dependency.get('vulnerabilities', []):
                      if not isinstance(vulnerability, dict):
                          continue
                      scores = []
                      for key, field in (('cvssv2', 'score'), ('cvssv3', 'baseScore'), ('cvssv4', 'baseScore')):
                          value = vulnerability.get(key)
                          if isinstance(value, dict):
                              try:
                                  scores.append(float(value[field]))
                              except (KeyError, TypeError, ValueError):
                                  pass
                      score = max(scores) if scores else None
                      if score is not None and score >= 7:
                          findings.append((package_name, vulnerability.get('name') or 'Unknown advisory', score))

          if findings:
              details.append(f'{len(findings)} finding(s) have an available CVSS score of 7.0 or higher:')
              details.extend(f'- {summary_text(package)}: {summary_text(advisory)} (CVSS {score:g})' for package, advisory, score in findings)
          elif scan_code == '15':
              details.append('The report contained no parsable CVSS 7+ findings; inspect the original scan logs and full report.')
          elif report is not None:
              details.append('No findings with an available CVSS score of 7.0 or higher were listed in the validated report.')

          if os.environ['UPLOAD_OUTCOME'] != 'success':
              error('Dependency-Check report artifact upload failed; the report may be unavailable from this run.')

          summary_lines = ['## OWASP Dependency-Check', '']
          summary_lines.append('**Result: FAILED**' if failures else '**Result: PASSED**')
          if failures:
              summary_lines.extend(['', '**Failure reasons:**'])
              summary_lines.extend(f'- {summary_text(reason)}' for reason in failures)
          if findings:
              summary_lines.append(f'**{len(findings)} CVSS 7+ finding(s)**')
          elif scan_outcome == 'success' and report is not None:
              summary_lines.append('No CVSS 7+ findings reported.')
          for detail in details:
              summary_lines.append(detail)
          summary_lines.extend(['', f'[Open run logs and the `owasp-dependency-check-report` artifact]({os.environ["ARTIFACT_URL"]}).'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(summary_lines) + '\n')
          print('\n'.join(summary_lines))

          if failures:
              raise SystemExit(1)
          PY

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    if: github.event.deleted != true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository changes for exposed secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          all_zero_sha=0000000000000000000000000000000000000000

          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == push ]]; then
            head_sha="$PUSH_AFTER_SHA"
            if [[ "$PUSH_BEFORE_SHA" == "$all_zero_sha" ]]; then
              # A new branch scans commits introduced since the repository default branch.
              default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
              if [[ -z "$DEFAULT_BRANCH" ]] || ! git check-ref-format "$default_ref" >/dev/null 2>&1; then
                echo "Repository default branch is missing or invalid" >&2
                exit 1
              fi
              base_sha="$(git rev-parse --verify "$default_ref^{commit}" 2>/dev/null)" || {
                echo "Repository default branch ref is unavailable: $default_ref" >&2
                exit 1
              }
            else
              base_sha="$PUSH_BEFORE_SHA"
            fi
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

          ensure_commit() {
            local sha="$1"
            if git cat-file -e "$sha^{commit}" 2>/dev/null; then
              return 0
            fi

            # Force-pushed commits may no longer be reachable from fetched refs.
            if [[ -z "$GH_TOKEN" ]]; then
              echo "Event commit is unavailable locally and authenticated retrieval is unavailable: $sha" >&2
              return 1
            fi
            local auth_header
            auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
            local git_http_url="${GITHUB_SERVER_URL%/}/"
            if ! git -c "http.${git_http_url}.extraheader=AUTHORIZATION: basic $auth_header" \
              fetch --no-tags --no-write-fetch-head origin "$sha" >/dev/null 2>&1; then
              echo "Event commit could not be retrieved from origin: $sha" >&2
              return 1
            fi
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "Event commit retrieval did not provide a commit object: $sha" >&2
              return 1
            fi
          }

          shas=("$base_sha" "$head_sha")
          for sha in "${shas[@]}"; do
            if [[ ! "$sha" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
              echo "Event commit SHA is invalid: $sha" >&2
              exit 1
            fi
          done
          for sha in "${shas[@]}"; do
            ensure_commit "$sha" || exit 1
          done

          log_opts="$base_sha..$head_sha --full-history -m"

          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --verbose --redact=100 --log-opts="$log_opts" /repo
