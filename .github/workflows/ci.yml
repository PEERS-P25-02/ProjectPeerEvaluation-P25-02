# This workflow checks that changes build and meet repository quality rules.
# Pull requests to main and pushes run the applicable jobs independently.
#
# TLDR: installs Node 24 dependencies, builds the frontend, and runs lint, unit,
# coverage, and formatting jobs for frontend and backend code.
name: CI - Build Lint and Unit Tests

on:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

jobs:
  # Shared install job verifies both package lockfiles can be installed.
  install-dependencies:
    name: Install Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./src/backend
        run: npm ci

  # Frontend build, lint, unit, and coverage jobs report separately.
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  repository-lint:
    name: Repository Lint (Frontend and Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: ./src/backend
      - run: npm run lint

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  frontend-coverage:
    name: Frontend Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      # Keep the generated report available after the runner exits.
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage

  # Backend jobs install and run from the backend package directory.
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci
        working-directory: ./src/backend
      - run: npm test
        working-directory: ./src/backend

  backend-coverage:
    name: Backend Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci
        working-directory: ./src/backend
      - run: npm run test:coverage
        working-directory: ./src/backend
      # Keep the generated report available after the runner exits.
      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: src/backend/coverage

  # Report formatting failures separately from build, lint, and test failures.
  formatting-check:
    name: Prettier Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
