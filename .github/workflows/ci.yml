# This workflow checks that changes build and meet repository quality rules.
# Pull requests to main and pushes run the applicable jobs independently.
#
# TLDR: installs Node 24 dependencies, builds the frontend, and runs lint, unit,
# coverage, and formatting jobs for frontend and backend code.
name: CI - Build Lint and Unit Tests

on:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

jobs:
  # Shared install job verifies both package lockfiles can be installed.
  install-dependencies:
    name: Install Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./src/backend
        run: npm ci

  # Frontend build, lint, unit, and coverage jobs report separately.
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  repository-lint:
    name: Repository Lint (Frontend and Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: ./src/backend
      - run: npm run lint

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  frontend-coverage:
    name: Frontend Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      # Keep the generated report available after the runner exits.
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage

  # Backend jobs install and run from the backend package directory.
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci
        working-directory: ./src/backend
      - run: npm test
        working-directory: ./src/backend

  backend-coverage:
    name: Backend Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci
        working-directory: ./src/backend
      - run: npm run test:coverage
        working-directory: ./src/backend
      # Keep the generated report available after the runner exits.
      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: src/backend/coverage

  # Report formatting failures separately from build, lint, and test failures.
  formatting-check:
    name: Prettier Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check

  dependency-vulnerability-scan:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Dependency-Check analyzes both lockfiles, including development dependencies.
      - name: Prepare scanner data and report directories
        id: dependency-check-paths
        run: |
          echo "data=$RUNNER_TEMP/dependency-check-data" >> "$GITHUB_OUTPUT"
          echo "reports=$RUNNER_TEMP/dependency-check-reports" >> "$GITHUB_OUTPUT"
          echo "cache-day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/dependency-check-data" "$RUNNER_TEMP/dependency-check-reports"

      - name: Restore Dependency-Check vulnerability data
        id: dependency-check-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.dependency-check-paths.outputs.data }}
          key: dependency-check-v13-validated-v1-${{ runner.os }}-${{ steps.dependency-check-paths.outputs.cache-day }}
          restore-keys: |
            dependency-check-v13-validated-v1-${{ runner.os }}-

      # Refresh first so the cache is saved only after a complete successful update.
      - name: Update Dependency-Check vulnerability data
        id: dependency-check-update
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          nvd_args=()
          if [[ -n "$NVD_API_KEY" ]]; then
            nvd_args=(--nvdApiKey "$NVD_API_KEY")
          else
            nvd_args=(--nvdDatafeed 'https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz')
          fi

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${{ steps.dependency-check-paths.outputs.data }}:/usr/share/dependency-check/data" \
            --env NVD_API_KEY \
            owasp/dependency-check:13.0.0 \
            --data /usr/share/dependency-check/data \
            "${nvd_args[@]}" \
            --updateonly

      - name: Save refreshed Dependency-Check vulnerability data
        if: steps.dependency-check-update.outcome == 'success' && steps.dependency-check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.dependency-check-paths.outputs.data }}
          key: dependency-check-v13-validated-v1-${{ runner.os }}-${{ steps.dependency-check-paths.outputs.cache-day }}

      # Dependency-Check analyzes both lockfiles, including development dependencies.
      - name: Scan both npm lockfiles
        id: dependency-check-scan
        continue-on-error: true
        run: |
          test -s "$GITHUB_WORKSPACE/package-lock.json"
          test -s "$GITHUB_WORKSPACE/src/backend/package-lock.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "${{ steps.dependency-check-paths.outputs.data }}:/usr/share/dependency-check/data" \
            --volume "${{ steps.dependency-check-paths.outputs.reports }}:/report" \
            owasp/dependency-check:13.0.0 \
            --project peers-npm-dependencies \
            --scan /src/package-lock.json \
            --scan /src/src/backend/package-lock.json \
            --format HTML \
            --format JSON \
            --out /report \
            --data /usr/share/dependency-check/data \
            --noupdate \
            --failOnCVSS 7

      - name: Validate Dependency-Check reports
        id: dependency-check-reports
        if: always()
        run: |
          html="$RUNNER_TEMP/dependency-check-reports/dependency-check-report.html"
          json="$RUNNER_TEMP/dependency-check-reports/dependency-check-report.json"
          test -s "$html"
          grep -Eiq '<html([[:space:]>])' "$html"
          test -s "$json"
          python3 - "$json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              report = json.load(report_file)

          scan_info = report.get("scanInfo") if isinstance(report, dict) else None
          project_info = report.get("projectInfo") if isinstance(report, dict) else None
          dependencies = report.get("dependencies") if isinstance(report, dict) else None
          if (
              not isinstance(scan_info, dict)
              or scan_info.get("engineVersion") != "13.0.0"
              or not isinstance(project_info, dict)
              or project_info.get("name") != "peers-npm-dependencies"
              or not isinstance(dependencies, list)
              or not dependencies
          ):
              raise SystemExit("Dependency-Check JSON is missing expected scanner, project, or dependency data")
          PY

      # Retain whichever reports were produced, including when scan validation fails.
      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: |
            ${{ steps.dependency-check-paths.outputs.reports }}/dependency-check-report.html
            ${{ steps.dependency-check-paths.outputs.reports }}/dependency-check-report.json
          if-no-files-found: error

      - name: Fail if update, scan, or report validation failed
        if: always() && (steps.dependency-check-update.outcome != 'success' || steps.dependency-check-scan.outcome != 'success' || steps.dependency-check-reports.outcome != 'success')
        run: exit 1

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    if: github.event.deleted != true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository changes for exposed secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          all_zero_sha=0000000000000000000000000000000000000000

          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == push ]]; then
            head_sha="$PUSH_AFTER_SHA"
            if [[ "$PUSH_BEFORE_SHA" == "$all_zero_sha" ]]; then
              base_sha=""
            else
              base_sha="$PUSH_BEFORE_SHA"
            fi
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

          shas=("$head_sha")
          if [[ -n "$base_sha" ]]; then
            shas+=("$base_sha")
          fi
          for sha in "${shas[@]}"; do
            if [[ ! "$sha" =~ ^[0-9a-fA-F]{40,64}$ ]] || ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "Event commit is missing or invalid: $sha" >&2
              exit 1
            fi
          done

          # New branches have no before SHA, so scan all history reachable from the head.
          if [[ -z "$base_sha" ]]; then
            log_opts="$head_sha --full-history -m"
          else
            log_opts="$base_sha..$head_sha --full-history -m"
          fi

          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --verbose --redact=100 --log-opts="$log_opts" /repo
