# Refresh the shared Dependency-Check database independently of pull-request code.
name: Update Dependency-Check Database

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

# A concurrency group prevents overlapping database writers; immutable cache keys retain each completed refresh.
concurrency:
  group: dependency-check-database-update
  cancel-in-progress: false

jobs:
  update-database:
    name: Update vulnerability database
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      # Use the exact runner-local data path and cache namespace consumed by CI scans.
      - name: Prepare Dependency-Check data path
        id: dependency-check-paths
        run: |
          echo "data=$RUNNER_TEMP/dependency-check-data" >> "$GITHUB_OUTPUT"
          echo "cache-key=dependency-check-v13.0.0-shared-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/dependency-check-data"

      # Restore the latest completed cache by prefix to preserve the incremental NVD update state.
      - name: Restore previous Dependency-Check database
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.dependency-check-paths.outputs.data }}
          key: dependency-check-v13.0.0-shared-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dependency-check-v13.0.0-shared-v1-${{ runner.os }}-

      - name: Require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [[ -z "$NVD_API_KEY" ]]; then
            echo "NVD_API_KEY is required by the scheduled database updater. Configure it as a repository Actions secret." >&2
            exit 1
          fi

      - name: Update Dependency-Check vulnerability data
        id: dependency-check-update
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DATA_DIR: ${{ steps.dependency-check-paths.outputs.data }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$DATA_DIR:/usr/share/dependency-check/data" \
            --env NVD_API_KEY \
            owasp/dependency-check:13.0.0 \
            --data /usr/share/dependency-check/data \
            --nvdApiKey "$NVD_API_KEY" \
            --nvdValidForHours 0 \
            --updateonly

      # Publish only after the updater succeeds and the database file is present.
      - name: Check database presence and record successful update time
        id: dependency-check-database
        if: steps.dependency-check-update.outcome == 'success'
        env:
          DATA_DIR: ${{ steps.dependency-check-paths.outputs.data }}
        run: |
          test -s "$DATA_DIR/odc.mv.db"
          date -u +%s > "$DATA_DIR/.dependency-check-last-successful-update"
          test -s "$DATA_DIR/.dependency-check-last-successful-update"

      - name: Save completed Dependency-Check database
        if: steps.dependency-check-database.outcome == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.dependency-check-paths.outputs.data }}
          key: ${{ steps.dependency-check-paths.outputs.cache-key }}

      - name: Fail if database update or validation failed
        if: always() && (steps.dependency-check-update.outcome != 'success' || steps.dependency-check-database.outcome != 'success')
        run: exit 1
