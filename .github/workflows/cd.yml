# CI verifies each landed main commit; CD consumes only its successful push run.
name: CD - Publish Staging Images
on:
  workflow_run:
    workflows: [CI - Build Lint and Tests]
    types: [completed]
    branches: [main]
permissions:
  contents: read
env:
  # For workflow_run, GITHUB_SHA is the default-branch tip, not the CI run head.
  CI_CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
  CI_RUN_ID: ${{ github.event.workflow_run.id }}
  CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
concurrency:
  # Keep publication runs serialized, including reruns.
  group: cd-staging-images
  cancel-in-progress: false
jobs:
  decide-staging:
    name: Decide staging deployment
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CI_CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Confirm the verified current main merge commit
        run: |
          [[ "$CI_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CI_CANDIDATE_SHA"
          main_tip="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$main_tip" != "$CI_CANDIDATE_SHA" ]]; then
            echo "::error::The verified CI commit is no longer the current main tip."
            exit 1
          fi
          parent_count="$(git cat-file -p "$CI_CANDIDATE_SHA" | awk '/^$/{exit} /^parent /{count++} END{print count+0}')"
          if [[ "$parent_count" != 2 ]]; then
            echo "::error::Only two-parent main merge commits may publish staging images."
            exit 1
          fi
      - name: Read last successful staging baseline
        id: baseline
        run: |
          if git fetch --no-tags origin refs/tags/staging-last-success:refs/tags/staging-last-success 2>/dev/null; then
            baseline="$(git rev-parse 'refs/tags/staging-last-success^{commit}' 2>/dev/null || true)"
            if [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'sha=%s\n' "$baseline" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Compare baseline with candidate
        id: decision
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: node scripts/decideStaging.cjs
  publish-staging-images:
    name: Publish Staging Images
    needs: decide-staging
    if: ${{ needs.decide-staging.result == 'success' && needs.decide-staging.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FRONTEND_IMAGE: ghcr.io/peers-p25-02/projectpeerevaluation-p25-02-frontend
      BACKEND_IMAGE: ghcr.io/peers-p25-02/projectpeerevaluation-p25-02-backend
    outputs:
      frontend_image: ${{ steps.manifest.outputs.frontend_image }}
      backend_image: ${{ steps.manifest.outputs.backend_image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CI_CANDIDATE_SHA }}
      - uses: docker/setup-buildx-action@v4
      - name: Reconfirm the verified current main merge commit before publication
        run: |
          [[ "$CI_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CI_CANDIDATE_SHA"
          main_tip="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$main_tip" != "$CI_CANDIDATE_SHA" ]]; then
            echo "::error::The verified CI commit is no longer the current main tip."
            exit 1
          fi
          parent_count="$(git cat-file -p "$CI_CANDIDATE_SHA" | awk '/^$/{exit} /^parent /{count++} END{print count+0}')"
          if [[ "$parent_count" != 2 ]]; then
            echo "::error::Only two-parent main merge commits may publish staging images."
            exit 1
          fi
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: final
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=https://peers-staging-backend.onrender.com/api
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.CI_CANDIDATE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.CI_CANDIDATE_SHA }}
      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.CI_CANDIDATE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.CI_CANDIDATE_SHA }}
      - name: Record immutable image references
        id: manifest
        env:
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
        run: |
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          frontend_ref="$FRONTEND_IMAGE@$FRONTEND_DIGEST"
          backend_ref="$BACKEND_IMAGE@$BACKEND_DIGEST"
          printf 'frontend_image=%s\n' "$frontend_ref" >> "$GITHUB_OUTPUT"
          printf 'backend_image=%s\n' "$backend_ref" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg sha "$CI_CANDIDATE_SHA" \
            --arg ci_run "$CI_RUN_ID" \
            --arg ci_attempt "$CI_RUN_ATTEMPT" \
            --arg cd_run "$GITHUB_RUN_ID" \
            --arg cd_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg frontend "$frontend_ref" \
            --arg backend "$backend_ref" \
            '{source_sha:$sha,ci_run_id:$ci_run,ci_run_attempt:$ci_attempt,cd_run_id:$cd_run,cd_run_attempt:$cd_attempt,frontend_image:$frontend,backend_image:$backend}' \
            > staging-images.json
          printf '### Staging images\n- Source SHA: `%s`\n- CI run: `%s` attempt `%s`\n- CD run: `%s` attempt `%s`\n- Frontend: `%s`\n- Backend: `%s`\n' \
            "$CI_CANDIDATE_SHA" "$CI_RUN_ID" "$CI_RUN_ATTEMPT" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$frontend_ref" "$backend_ref" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: staging-images-${{ env.CI_CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-images.json
          if-no-files-found: error
  deploy-staging:
    name: Deploy Staging
    needs: [decide-staging, publish-staging-images]
    if: ${{ needs.decide-staging.result == 'success' && needs.decide-staging.outputs.deploy == 'true' && needs.publish-staging-images.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      BACKEND_IMAGE: ${{ needs.publish-staging-images.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.publish-staging-images.outputs.frontend_image }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      BACKEND_SERVICE_ID: ${{ vars.BACKEND_SERVICE_ID }}
      FRONTEND_SERVICE_ID: ${{ vars.FRONTEND_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Require the staging smoke fixture token before deployment
        env:
          STAGING_EVALUATION_TOKEN: ${{ secrets.STAGING_EVALUATION_TOKEN }}
        run: |
          if [[ ! "$STAGING_EVALUATION_TOKEN" =~ ^[A-Za-z0-9_-]{12,256}$ ]]; then
            echo "::error::Staging smoke fixture token is not configured."
            exit 1
          fi
      - name: Deploy and verify staging services
        id: deploy
        run: node scripts/deployStaging.cjs
      - name: Upload deployment result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: staging-deployment-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-deployment.json
          if-no-files-found: error
  validate-staging-smoke:
    name: Staging Smoke Tests
    needs: [decide-staging, publish-staging-images, deploy-staging]
    if: ${{ needs.decide-staging.result == 'success' && needs.decide-staging.outputs.deploy == 'true' && needs.publish-staging-images.result == 'success' && needs.deploy-staging.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      FRONTEND_IMAGE: ${{ needs.publish-staging-images.outputs.frontend_image }}
      BACKEND_IMAGE: ${{ needs.publish-staging-images.outputs.backend_image }}
      STAGING_FRONTEND_URL: https://projectpeerevaluation-p25-02-frontend.onrender.com
      STAGING_BACKEND_URL: https://peers-staging-backend.onrender.com
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Mask the fixture token in workflow logs
        env:
          STAGING_EVALUATION_TOKEN: ${{ secrets.STAGING_EVALUATION_TOKEN }}
        run: echo "::add-mask::$STAGING_EVALUATION_TOKEN"
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run staging-only smoke checks
        id: smoke
        env:
          STAGING_EVALUATION_TOKEN: ${{ secrets.STAGING_EVALUATION_TOKEN }}
        run: npx playwright test --config=playwright.staging.config.cjs
      - name: Write bounded validation evidence
        if: ${{ always() }}
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          STAGING_EVALUATION_TOKEN: ${{ secrets.STAGING_EVALUATION_TOKEN }}
        run: node scripts/writeStagingSmokeEvidence.cjs
      - name: Upload staging smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: staging-smoke-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-smoke-result.json
          if-no-files-found: error
  record-staging-success:
    name: Successful Staging Baseline
    needs: [decide-staging, deploy-staging, validate-staging-smoke]
    if: ${{ needs.decide-staging.result == 'success' && needs.decide-staging.outputs.deploy == 'true' && needs.deploy-staging.result == 'success' && needs.validate-staging-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Advance last successful staging baseline
        run: git push origin "$SOURCE_SHA:refs/tags/staging-last-success" --force
