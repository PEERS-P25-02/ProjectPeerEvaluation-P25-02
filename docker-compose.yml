# This file runs PEERS locally with its database and a private email inbox.
# The frontend uses production images; deployment stays on Render.
#
# TLDR: starts MongoDB, Mailpit, the backend, and Nginx on localhost ports 27017,
# 1025/8025, 5000, and 3000. Requires Compose v2.24+ for optional env_file.
services:
  mongodb:
    image: mongo:8.0
    # Transactions keep peer responses and completion atomic; wait for a primary.
    command: [mongod, --replSet, peers-rs, --bind_ip_all]
    # Named storage keeps local database records between Compose restarts.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'try { rs.status(); } catch (e) { if (e.codeName !== "NotYetInitialized") throw e; rs.initiate({_id: "peers-rs", members: [{_id: 0, host: "mongodb:27017"}]}); } quit(db.hello().isWritablePrimary ? 0 : 1);'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27.4
    # Mailpit web UI is localhost:8025; SMTP is published on localhost:1025.
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build: ./src/backend
    # Keep the development API port bound to this computer only.
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      # Container addresses override native-local defaults from .env.
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongodb:27017/peer-eval}
      NODE_ENV: production
      PORT: "5000"
      # Compose stops before startup when the secret is missing or empty.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set. Run npm run setup:env or supply JWT_SECRET.}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Always capture local email in Mailpit, even with saved provider settings.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_AUTH_REQUIRED: "false"
      SMTP_SERVICE: ""
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ${SMTP_FROM:-peers-test@example.com}
    depends_on:
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    # Compose waits for this health check before starting the frontend.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5000/api/health')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    # Nginx serves the site and proxies /api requests to the backend service.
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./nginx/compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  mongodb_data:
