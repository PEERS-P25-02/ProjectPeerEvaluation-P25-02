# Opt-in runtime instrumentation; never merged into the development stack.
services:
  backend:
    command: [node, --require, ./scripts/runtimeCoverage.cjs, index.js]
    environment:
      NODE_V8_COVERAGE: /coverage/backend
  frontend:
    build:
      args:
        PEERS_COVERAGE: '1'
  tests:
    environment:
      PEERS_COVERAGE: '1'
